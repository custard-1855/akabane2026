<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>素数カウンタ</title>
  <link rel="stylesheet" href="./style.css">
  <script src="/core/sdk.js" defer></script>
  <script type="module" src="./main.js"></script>
</head>
<body>
  <main>
    <h1>素数カウンタ</h1>
    <p class="note">N 以下の素数を数えます。N が大きいときは Mac の計算APIで計算します。</p>
    <form id="form">
      <input id="limit" type="number" min="2" max="20000000" value="1000000" inputmode="numeric" aria-label="N">
      <button type="submit">計算</button>
    </form>
    <p id="result" aria-live="polite"></p>
    <p class="note">前回の結果(この端末・サーバ保存): <span id="last">-</span></p>
    <button id="finish" type="button">終わる</button>
  </main>
</body>
</html>
