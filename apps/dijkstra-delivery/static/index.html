<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>配達員ダイクストラ</title>
  <link rel="stylesheet" href="./style.css">
  <!-- 基盤の sdk。基盤なしで配信したときは読めないが、core-adapter.js が無視する -->
  <script src="/core/sdk.js" defer></script>
  <script type="module" src="./main.js"></script>
</head>
<body>
  <div id="app">
    <header class="bar bar-main">
      <select id="stage-select" aria-label="ステージ"></select>
      <div class="seg" role="radiogroup" aria-label="モード">
        <button id="mode-a" role="radio" aria-checked="true">配達</button>
        <button id="mode-b" role="radio" aria-checked="false">管制室</button>
      </div>
    </header>

    <nav class="bar bar-actions">
      <button id="btn-undo">1手戻る</button>
      <button id="btn-reset">リセット</button>
      <button id="btn-hint">ヒント①</button>
      <button id="btn-heat" aria-pressed="false" disabled>等時線</button>
      <button id="btn-finish">終わる</button>
    </nav>

    <main id="map-wrap">
      <svg id="map" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" role="img" aria-label="地図"></svg>
    </main>

    <section id="panel">
      <div id="status"></div>
      <p id="message" aria-live="polite"></p>
      <div id="legend" hidden>
        <span>近い 0</span><span class="scale"></span><span>遠い <span class="max"></span></span>
      </div>
      <div id="actions"></div>
      <ol id="log" hidden></ol>
    </section>
  </div>
</body>
</html>
