<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>電波技師ウェルシュ(試作)|スカラベ・ネットワーク研究会</title>
    <link rel="stylesheet" href="../fonts/ibm-plex-sans-jp/400.css" />
    <link rel="stylesheet" href="../fonts/ibm-plex-sans-jp/500.css" />
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <!-- 試作なのでタイトル画面は置かない(docs/games.md 3.2)。フォントと tokens.css は配達員ダイクストラのものを使う -->
    <div class="game-screen">
      <header class="toolbar">
        <button type="button" id="to-select">ゲームを選ぶ</button>
        <span class="game-name">電波技師ウェルシュ</span>
        <div class="segmented" role="group" aria-label="モード">
          <button type="button" id="mode-a" class="active">自分で割り当てる</button>
          <button type="button" id="mode-b">自動で割り当てる</button>
        </div>
        <button type="button" id="reset">リセット</button>
        <span class="spacer"></span>
        <button type="button" id="done" class="primary">完成</button>
        <button type="button" id="run" class="primary" hidden>スタート</button>
        <button type="button" id="show-terms" hidden>ことばの対応</button>
      </header>
      <main class="board-wrap">
        <svg id="board" role="img" aria-label="地図"></svg>
        <!-- 層Bの後に、2回の結果と自分の答えを並べる -->
        <div id="compare" class="compare" hidden>
          <figure>
            <svg id="cmp-1" aria-hidden="true"></svg>
            <figcaption id="cmp-1-cap"></figcaption>
          </figure>
          <figure>
            <svg id="cmp-2" aria-hidden="true"></svg>
            <figcaption id="cmp-2-cap"></figcaption>
          </figure>
          <figure>
            <svg id="cmp-mine" aria-hidden="true"></svg>
            <figcaption id="cmp-mine-cap"></figcaption>
          </figure>
        </div>
        <!-- 層Bの後に出す、ゲームの言葉と正式な用語の対応表(docs/games.md 5.7)。解説の本文は試作では作らない -->
        <section id="terms" class="terms" aria-labelledby="terms-title" hidden>
          <h2 id="terms-title">ことばの対応</h2>
          <dl id="terms-list"></dl>
          <div class="terms-actions">
            <button type="button" id="terms-close" class="primary">結果に戻る</button>
          </div>
        </section>
      </main>
      <footer class="messages" aria-live="polite">
        <p id="msg"></p>
        <p id="sub"></p>
      </footer>
    </div>
  </body>
</html>
