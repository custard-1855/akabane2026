# 研究室サイト(lab-site/): チェックとテストを行い、main への push なら GitHub Pages に公開する
name: lab-site

on:
  push:
    paths: ["lab-site/**", ".github/workflows/lab-site.yml"]
  pull_request:
    paths: ["lab-site/**", ".github/workflows/lab-site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-site-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: lab-site

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lab-site/package-lock.json
      - run: npm ci
      - name: 整形・ESLint・型チェック・処理のテスト
        run: npm run check
      - name: Playwright のブラウザを入れる
        run: npx playwright install --with-deps chromium
      - name: ブラウザのテスト(見た目と挙動)
        run: npm run test:e2e
      - name: 失敗したときの結果を残す
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            lab-site/playwright-report/
            lab-site/test-results/
          retention-days: 7

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lab-site/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: lab-site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
