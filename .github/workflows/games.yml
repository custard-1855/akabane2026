# ゲームのアプリ(apps/dijkstra-delivery/)のテストを行い、main なら static/ を GitHub Pages に公開する。
# ビルドはしない(実装方針 1章)。apps/ が変わったときだけ動かす
name: games

on:
  push:
    branches: [main]
    paths: ["apps/**", ".github/workflows/games.yml"]
  pull_request:
    paths: ["apps/**", ".github/workflows/games.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: games-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/dijkstra-delivery

jobs:
  test:
    name: テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test

  deploy:
    name: 公開
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      # static/ はすべて相対パスで参照しているので、/akabane2026/ の下にそのまま置ける
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/dijkstra-delivery/static
      - id: deployment
        uses: actions/deploy-pages@v4
