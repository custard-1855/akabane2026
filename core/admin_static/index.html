<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>監視 - 管理</title>
  <link rel="stylesheet" href="/static/admin.css">
  <script src="/static/common.js" defer></script>
  <script src="/static/monitor.js" defer></script>
</head>
<body>
  <header>
    <h1>管理</h1>
    <nav>
      <a href="/" aria-current="page">監視</a>
      <a href="/surveys">アンケート</a>
    </nav>
    <span class="spacer"></span>
    <label>集計期間
      <select id="minutes">
        <option value="15">15分</option>
        <option value="60" selected>1時間</option>
        <option value="1440">24時間</option>
        <option value="10080">7日</option>
      </select>
    </label>
    <span class="meta" id="updated"></span>
  </header>
  <main>
    <section>
      <h2>接続中の端末<span class="count" id="connected-count"></span></h2>
      <div id="connected"></div>
    </section>
    <section>
      <h2>アプリごとの呼び出し</h2>
      <div id="apps"></div>
    </section>
    <section>
      <h2>APIごとの呼び出し</h2>
      <div id="routes"></div>
    </section>
    <section>
      <h2>エラー(ステータス 400 以上、新しい順に最大100件)</h2>
      <div id="errors"></div>
    </section>
  </main>
</body>
</html>
