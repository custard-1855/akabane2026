[project]
name = "akabane2026"
version = "0.1.0"
description = "LAN内の端末からMac上の複数Webアプリを使うための基盤"
readme = "README.md"
authors = [
    { name = "custard-1855", email = "narian.tome.reon@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
