<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR読み取り(検証用)</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #f4f4f4; color: #111; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  #status { padding: 8px 12px; border-radius: 6px; background: #e8e8e8; font-size: 14px; }
  #status.error { background: #fde2e2; color: #900; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
  video { width: 100%; background: #000; border-radius: 8px; }
  video.mirror { transform: scaleX(-1); }
  #result { font: 700 48px/1.2 ui-monospace, monospace; letter-spacing: 0.15em; text-align: center; min-height: 1.2em; margin: 12px 0; }
  #result.ok { color: #0a7a2f; }
  #result.ng { color: #b00; }
  #manual { font: 24px ui-monospace, monospace; width: 8em; text-transform: uppercase; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; background: #fff; }
  td, th { border-bottom: 1px solid #ddd; padding: 4px 8px; text-align: left; }
  select, button { font-size: 16px; padding: 6px 10px; }
</style>
</head>
<body>
<main>
  <h1>QR読み取り(検証用)</h1>
  <div id="status">準備中</div>
  <div class="row">
    <select id="camera" aria-label="カメラ"></select>
    <button id="start" type="button">カメラ開始</button>
    <span id="decoder"></span>
  </div>
  <video id="video" playsinline muted></video>
  <div id="result"></div>
  <form id="manualForm" class="row">
    <label>手入力・スキャナ <input id="manual" maxlength="64" autocomplete="off" autocapitalize="characters"></label>
    <button type="submit">確定</button>
  </form>
  <table>
    <thead><tr><th>時刻</th><th>経路</th><th>値</th><th>形式</th><th>開始からの秒数</th></tr></thead>
    <tbody id="log"></tbody>
  </table>
</main>
<script src="vendor/jsQR.js"></script>
<script>
const CODE_RE = /^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{5}$/;
const $ = (id) => document.getElementById(id);
const video = $("video");
const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d", { willReadFrequently: true });

let stream = null;
let detector = null;   // BarcodeDetector があれば使う。無い環境(Windows の Chrome など)は jsQR
let startedAt = 0;
let last = { value: null, at: 0 };

function setStatus(text, error = false) {
  $("status").textContent = text;
  $("status").className = error ? "error" : "";
}

// 参加証ページの QR はコードそのもの。URL(…/pass/#CODE)が来ても読めるようにする
function extractCode(raw) {
  const s = raw.trim();
  const i = s.indexOf("#");
  return (i >= 0 ? s.slice(i + 1) : s).toUpperCase();
}

function accept(raw, via) {
  const code = extractCode(raw);
  const now = performance.now();
  if (code === last.value && now - last.at < 3000) return;  // 同じQRの連続検出は無視
  last = { value: code, at: now };
  const ok = CODE_RE.test(code);
  $("result").textContent = code;
  $("result").className = ok ? "ok" : "ng";
  if (navigator.vibrate) navigator.vibrate(ok ? 80 : [40, 40, 40]);
  const tr = document.createElement("tr");
  const secs = via === "カメラ" ? ((now - startedAt) / 1000).toFixed(1) : "";
  for (const v of [new Date().toLocaleTimeString(), via, code, ok ? "OK" : "NG", secs]) {
    const td = document.createElement("td");
    td.textContent = v;
    tr.appendChild(td);
  }
  $("log").prepend(tr);
  if (via === "カメラ") startedAt = now;  // 次の読み取りまでの時間を測る
}

async function setupDecoder() {
  const force = new URLSearchParams(location.search).get("decoder");
  if (force !== "jsqr" && "BarcodeDetector" in window) {
    const formats = await BarcodeDetector.getSupportedFormats();
    if (formats.includes("qr_code")) detector = new BarcodeDetector({ formats: ["qr_code"] });
  }
  $("decoder").textContent = "デコーダ: " + (detector ? "BarcodeDetector" : "jsQR");
}

async function listCameras() {
  const devices = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput");
  const sel = $("camera");
  const current = sel.value;
  sel.innerHTML = "";
  devices.forEach((d, i) => sel.add(new Option(d.label || `カメラ ${i + 1}`, d.deviceId)));
  if (current) sel.value = current;
}

async function start() {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  const deviceId = $("camera").value;
  try {
    // 展示用端末は立てて置くので、既定は前面カメラ
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: deviceId
        ? { deviceId: { exact: deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } }
        : { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
    });
  } catch (e) {
    setStatus(`カメラを開けない: ${e.name} ${e.message}`, true);
    return;
  }
  video.srcObject = stream;
  await video.play();
  const settings = stream.getVideoTracks()[0].getSettings();
  video.classList.toggle("mirror", settings.facingMode !== "environment");
  await listCameras();
  if (settings.deviceId) $("camera").value = settings.deviceId;
  setStatus(`カメラ動作中 ${settings.width}×${settings.height}`);
  startedAt = performance.now();
  scanLoop();
}

async function scanOnce() {
  if (video.readyState < video.HAVE_ENOUGH_DATA) return;
  if (detector) {
    const found = await detector.detect(video);
    if (found.length) accept(found[0].rawValue, "カメラ");
    return;
  }
  // jsQR は重いので 640px 幅に縮めてから渡す
  const scale = Math.min(1, 640 / video.videoWidth);
  canvas.width = Math.round(video.videoWidth * scale);
  canvas.height = Math.round(video.videoHeight * scale);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const found = jsQR(img.data, img.width, img.height, { inversionAttempts: "dontInvert" });
  if (found) accept(found.data, "カメラ");
}

function scanLoop() {
  const current = stream;
  const tick = async () => {
    if (stream !== current) return;  // カメラを切り替えたら古いループは止める
    try { await scanOnce(); } catch (e) { setStatus(`読み取りエラー: ${e.message}`, true); }
    setTimeout(tick, 100);
  };
  tick();
}

$("start").onclick = start;
$("camera").onchange = start;
$("manualForm").onsubmit = (e) => {
  e.preventDefault();
  if ($("manual").value) accept($("manual").value, "入力");
  $("manual").value = "";
};

(async () => {
  await setupDecoder();
  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
    setStatus("このページはセキュアコンテキストではないためカメラを使えない(https:// で開く)。手入力・スキャナは使える", true);
    $("start").disabled = true;
    return;
  }
  setStatus("「カメラ開始」を押す");
})();
</script>
</body>
</html>
