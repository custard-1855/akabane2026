<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>回線係フォード(試作)|スカラベ・ネットワーク研究会</title>
    <link rel="stylesheet" href="./fonts/ibm-plex-sans-jp/400.css" />
    <link rel="stylesheet" href="./fonts/ibm-plex-sans-jp/500.css" />
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <!-- 試作なのでタイトル画面は置かない(docs/games.md 3.2) -->
    <div class="game-screen">
      <header class="toolbar">
        <span class="game-name">回線係フォード</span>
        <button type="button" id="undo">1手戻る</button>
        <button type="button" id="reset">リセット</button>
      </header>
      <main class="board-wrap">
        <svg id="board" role="img" aria-label="地図"></svg>
      </main>
      <footer class="messages" aria-live="polite">
        <p id="msg"></p>
        <p id="sub"></p>
      </footer>
    </div>
  </body>
</html>
